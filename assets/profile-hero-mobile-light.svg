<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Ted Huang: Enterprise IT to AI agent systems</title>
  <desc id="desc">A structured navy, white and flag-red profile banner with technical grid lines, blue circuit traces and restrained green accents. Decorative graphics do not represent live data.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe3ed" stroke-width="0.6"/></pattern>
    <clipPath id="clip"><rect width="600" height="260" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="260" fill="#f6f8fc"/>
    <rect width="600" height="260" fill="url(#grid)"/>
    <path d="M430 0H600V260H280Z" fill="#102744" opacity="0.045"/>
    <rect x="0" y="0" width="8" height="260" fill="#b31942"/>
    <path d="M40 40h24M40 40v16M560 220h-24M560 220v-16" fill="none" stroke="#0969da" stroke-width="2"/>
    <rect x="40" y="55" width="7" height="7" fill="#39d353"/>
    <text x="58" y="63" fill="#465d76" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.6">SYSTEMS / AI</text>
    <text x="40" y="133" fill="#102744" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">Ted Huang<tspan fill="#b31942">.</tspan></text>
    <text x="41" y="172" fill="#465d76" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="0.5">ENTERPRISE IT → AI AGENTS</text>
    <rect x="0" y="252" width="600" height="8" fill="#102744"/>
    <rect x="0" y="252" width="200" height="8" fill="#b31942"/>
    <rect x="200" y="252" width="200" height="8" fill="#ffffff"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="259" rx="7.5" fill="none" stroke="#dbe3ed"/>
</svg>
